<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영생고 교과 선택</title><meta name="description" content="영생고 학생을 위한 학기별 교과 선택. 학교 편성 과목과 학점, 대학 핵심·권장과목을 한곳에서 확인하세요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23182f53'/%3E%3Cpath d='M16 19h14q5 0 5 5v25q-4-5-19-5zM48 19H35v30q4-5 13-5z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20261003-social-science"></head><body>
<header class="topbar"><div class="brand"><img class="logo school-logo" src="assets/youngsaeng-logo-hd.png" width="43" height="43" alt="영생고 교표"><div><strong>영생고 교과 선택</strong><span>전주영생고등학교</span></div></div><button class="outline" id="openPlan">전체 선택표</button></header>
<main><div class="intro"><div><h1>학기별 과목 선택</h1></div><span class="save-status" id="saveStatus" role="status">이 기기에 자동 저장</span></div>
<section class="university-panel" aria-labelledby="universityTitle"><div class="university-heading"><div><span class="step">진로 참고</span><h2 id="universityTitle">대학 핵심·권장과목</h2></div><span class="source-chip" id="dbCount">어디가+샘플 자료</span></div><form id="searchForm" class="search-form"><label>대학명<input id="university" autocomplete="off" list="universityList" placeholder="예: 전북대, 서울대"><datalist id="universityList"></datalist></label><label>학과·계열<input id="department" autocomplete="off" placeholder="예: 간호, 컴퓨터, 경영"></label><button class="primary" type="submit">검색</button></form><div id="searchResults" aria-live="polite"></div><div id="recommendation"></div></section>
<div class="workspace"><section class="course-workspace" aria-label="학기별 과목 선택"><nav id="semesterTabs" class="semester-tabs" aria-label="학기 선택"></nav><div class="semester-heading"><div><h2 id="semesterTitle"></h2></div><div class="semester-credit"><strong id="semesterCredit">0</strong><span>학점 선택</span></div></div><div class="course-toolbar"><label class="course-search"><span aria-hidden="true">⌕</span><input id="courseSearch" placeholder="이 학기 과목 찾기" aria-label="이 학기 과목 찾기"></label><label class="check-filter"><input type="checkbox" id="recommendedOnly">대학 안내 과목만</label></div><div id="courseGroups"></div></section>
<aside class="summary-panel" aria-labelledby="summaryTitle"><div class="summary-title"><h2 id="summaryTitle">나의 선택 현황</h2></div><div class="total"><span>3년 교과 학점</span><div><strong id="totalCredit">58</strong><span>/ 174</span></div><div class="progress"><span id="totalProgress"></span></div><p id="totalNote"></p></div><div class="summary-line"><span>선택그룹 완료</span><strong id="groupComplete"></strong></div><div class="summary-line"><span>국어·영어·수학</span><strong id="kemCredit"></strong></div><div class="summary-line"><span>사회</span><strong id="socialCredit"></strong></div><div class="summary-line"><span>과학</span><strong id="scienceCredit"></strong></div><div id="checkStatus" role="status"></div><details class="credit-details" open><summary>교과군별 최소 이수학점</summary><div id="requiredCredits"></div></details><button class="primary full" id="reviewPlan">전체 선택표 보기</button><button class="text-button full" id="clearPlan">선택 초기화</button></aside></div>
<footer><span>전주영생고등학교</span><details><summary>자료 출처</summary><p>학교 과목: <a href="https://thecomajo.github.io/youngsaeng/" target="_blank" rel="noopener">기존 도움앱</a> · 원본 편성표 미대조</p><p>대학: <a href="https://www.adiga.kr/uct/ces/archiveView.do?menuId=PCUCTCES1000&prtlBbsId=26634" target="_blank" rel="noopener">어디가 2028 권장과목</a></p><p>핵심·권장은 이수 권장 기준입니다. 최종 신청은 학교 안내를 확인하세요.</p></details></footer></main>
<dialog id="planDialog"><div class="dialog-header"><div><h2>나의 전체 선택표</h2></div><button id="closePlan" class="icon-button" aria-label="닫기">×</button></div><div class="student-identity"><label>학번<input id="studentNumber" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="off" placeholder="예: 10123"></label><label>이름<input id="studentName" type="text" maxlength="30" autocomplete="off" placeholder="예: 홍길동"></label></div><div id="planContent"></div><div class="dialog-actions"><button class="outline" id="sharePlan">공유하기</button><button class="outline" id="printPlan">인쇄하기</button><button class="primary" id="downloadPdf">PDF 저장</button></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><noscript><p>과목 선택을 사용하려면 JavaScript를 활성화해 주세요.</p></noscript><script type="module" src="app.mjs?v=20261003-social-science"></script></body></html>
